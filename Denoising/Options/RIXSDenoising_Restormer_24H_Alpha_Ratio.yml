# Correct Alpha-ratio configuration like NAFNet
# Alpha controls MAE/MSE ratio: Loss = alpha * MAE + (1 - alpha) * MSE

# General settings
name: Restormer_24H_Alpha_Ratio_0
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 42

# Dataset settings
datasets:
  train:
    name: RIXSTrainSet
    type: RIXSDataset
    use_real_rixs_data: true
    in_ch: 1  
    out_ch: 1
    # Updated training data path
    dataroot_gt: /home/uguelt/data/training/split_data/CNN_training_128_128_onlySignal_0p95_maxEqLC_6_maxRatioHCLC_20_sum16.hdf5/seed0/training_data.hdf5
    geometric_augs: true
    gt_size: 128

    # Use original default parameters
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1

    # Progressive training settings
    mini_batch_sizes: [16, 12, 8, 6, 4, 2, 1]
    iters: [50000, 40000, 35000, 30000, 25000, 15000, 10000]
    gt_sizes: [64, 80, 96, 112, 120, 128, 128]

    filename_tmpl: '{}'
    io_backend:
      type: disk
    prefetch_mode: ~

  val:
    name: RIXSValSet
    type: RIXSTestDataset
    use_real_rixs_data: true
    in_ch: 1
    # Updated validation data path  
    dataroot_gt: /home/uguelt/data/validation/split_data/CNN_validation_128_128_onlySignal_0p95_maxEqLC_6_maxRatioHCLC_20_sum16.hdf5/seed0/validation_data.hdf5
    dataroot_lq: /home/uguelt/data/validation/split_data/CNN_validation_128_128_onlySignal_0p95_maxEqLC_6_maxRatioHCLC_20_sum16.hdf5/seed0/validation_data.hdf5
    io_backend:
      type: disk

# Network settings
network_g:
  type: Restormer
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: BiasFree
  dual_pixel_task: False

# Path settings
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# Training settings with CORRECT Alpha ratio parameter
train:
  total_iter: 200000
  warmup_iter: -1
  use_grad_clip: true

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [70000, 130000]
    restart_weights: [1, 1]
    eta_mins: [!!float 2e-4, !!float 1e-6]

  # CORRECT Alpha loss like NAFNet: Loss = alpha * MAE + (1 - alpha) * MSE
  pixel_opt:
    type: AlphaMAEMSELoss
    alpha: !!float 0.3        # Alpha ratio parameter (like NAFNet)
                              # 0.0 = Pure MSE loss
                              # 1.0 = Pure MAE loss  
                              # 0.3 = 30% MAE + 70% MSE
    loss_weight: 1.0          # Overall loss weight
    reduction: 'mean'

  # Augmentation
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

# Enhanced validation settings with comprehensive metrics
val:
  window_size: 8
  val_freq: !!float 2e3  # Every 2k iterations
  save_img: false
  rgb2bgr: false
  use_image: false
  max_minibatch: 16
  
  metrics:
    # PSNR (Peak Signal-to-Noise Ratio)
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    
    # SSIM (Structural Similarity Index)
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    
    # MAE (Mean Absolute Error)
    mae:
      type: calculate_mae
      crop_border: 0
      test_y_channel: false
    
    # MSE (Mean Squared Error)
    mse:
      type: calculate_mse
      crop_border: 0
      test_y_channel: false

# Enhanced logging settings with training history
logger:
  print_freq: 500              # Print every 500 iterations
  save_checkpoint_freq: !!float 2e3  # Save every 2k iterations
  use_tb_logger: true          # Enable tensorboard for metric tracking
  wandb: ~

# Distributed settings
dist_params:
  backend: nccl
  port: 29500

is_train: true
dist: false
rank: 0
