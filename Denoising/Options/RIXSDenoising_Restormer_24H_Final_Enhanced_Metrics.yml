# Enhanced 24H configuration with comprehensive validation metrics including MSE/MAE tracking
# Based on RIXSDenoising_Restormer_24H_Final.yml with added MSE/MAE validation metrics

# General settings
name: Restormer_24H_Final_Enhanced_Metrics_0
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 42

# Dataset settings
datasets:
  train:
    name: RIXSTrainSet
    type: RIXSDataset
    use_real_rixs_data: true
    in_ch: 1  
    out_ch: 1
    # Updated training data path
    dataroot_gt: /home/uguelt/data/training/split_data/CNN_training_128_128_onlySignal_0p95_maxEqLC_6_maxRatioHCLC_20_sum16.hdf5/seed0/training_data.hdf5
    geometric_augs: true
    gt_size: 128

    # Use original default parameters
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1

    # Progressive training settings
    mini_batch_sizes: [16, 12, 8, 6, 4, 2, 1]
    iters: [50000, 40000, 35000, 30000, 25000, 15000, 10000]
    gt_sizes: [64, 80, 96, 112, 120, 128, 128]

    filename_tmpl: '{}'
    io_backend:
      type: disk
    prefetch_mode: ~

  val:
    name: RIXSValSet
    type: RIXSTestDataset
    use_real_rixs_data: true
    in_ch: 1
    # Updated validation data path  
    dataroot_gt: /home/uguelt/data/validation/split_data/CNN_validation_128_128_onlySignal_0p95_maxEqLC_6_maxRatioHCLC_20_sum16.hdf5/seed0/validation_data.hdf5
    dataroot_lq: /home/uguelt/data/validation/split_data/CNN_validation_128_128_onlySignal_0p95_maxEqLC_6_maxRatioHCLC_20_sum16.hdf5/seed0/validation_data.hdf5
    io_backend:
      type: disk

# Network settings
network_g:
  type: Restormer
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: BiasFree
  dual_pixel_task: False

# Path settings
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# Training settings
train:
  total_iter: 200000
  warmup_iter: -1
  use_grad_clip: true

  optim_g:
    type: AdamW
    lr: !!float 1e-4  # Reduced learning rate to prevent nan loss
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [70000, 130000]
    restart_weights: [1, 1]
    eta_mins: [!!float 2e-4, !!float 1e-6]

  # Loss
  pixel_opt:
    type: L1Loss
    loss_weight: 1

  # Perceptual loss (commented out for now)
  # perceptual_opt:
  #   type: PerceptualLoss
  #   layer_weights:
  #     'conv5_4': 1  # before relu
  #   vgg_type: vgg19
  #   use_input_norm: true
  #   range_norm: false
  #   perceptual_weight: 1.0
  #   style_weight: 0
  #   criterion: l1

  # Contextual loss
  # contextual_opt:
  #   type: ContextualLoss
  #   layer_weights:
  #     'conv_4_4': 1.0
  #   max_1d_size: 64
  #   distance_type: 'cosine'
  #   calc_type: 'regular'
  #   z_norm: false
  #   crop_quarter: false
  #   b: 1.0
  #   band_width: 0.5
  #   use_vgg: true
  #   net: vgg19

# Enhanced validation settings with comprehensive metrics
val:
  window_size: 8
  val_freq: !!float 2e3  # Every 2k iterations - frequent for monitoring MSE/MAE
  save_img: false
  rgb2bgr: false
  use_image: false
  max_minibatch: 16
  
  metrics:
    # PSNR (Peak Signal-to-Noise Ratio)
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    
    # SSIM (Structural Similarity Index)
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    
    # MAE (Mean Absolute Error) - Alpha metric for RIXS
    mae:
      type: calculate_mae
      crop_border: 0
      test_y_channel: false
    
    # MSE (Mean Squared Error) - Alpha metric for RIXS  
    mse:
      type: calculate_mse
      crop_border: 0
      test_y_channel: false

# Enhanced logging settings
logger:
  print_freq: 500  # Print every 500 iterations
  save_checkpoint_freq: !!float 2e3  # Save every 2k iterations
  use_tb_logger: true  # Enable tensorboard for metric tracking
  wandb: ~

# Distributed settings
dist_params:
  backend: nccl
  port: 29500

is_train: true
dist: false
rank: 0
